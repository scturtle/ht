[[bin]]
name = "ht"
path = "src/main.rs"

[package]
name = "herdr"
version = "0.9.5"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents (personal Core-only fork)"
license = "Apache-2.0"
include = [
    "src/**/*",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[workspace]
members = ["crates/ghostty-vt"]
default-members = [".", "crates/ghostty-vt"]

[profile.dev.package."*"]
debug = 0

[dependencies]
ghostty-vt = { path = "crates/ghostty-vt" }
signal-hook = "0.3"
base64 = "0.22.1"
bytes = "1"
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1.13.1"
